<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZoneCloud — بنية تخزين سحابية موزّعة عالميًا</title>
<style>
  /* ============================================================
     Design Tokens
     ============================================================ */
  :root{
    --bg:    #07091a;
    --bg-2:  #0d1224;
    --bg-3:  #131a35;

    --card:   rgba(255,255,255,.04);
    --border: rgba(255,255,255,.08);

    --p1: #6366f1;
    --p2: #a855f7;
    --p3: #06b6d4;

    --ok:   #10b981;
    --err:  #ef4444;
    --warn: #f59e0b;

    --txt: #e8ebf5;
    --dim: #8b93b0;

    --grad:      linear-gradient(135deg,#6366f1,#a855f7);
    --grad-3:    linear-gradient(135deg,#6366f1,#06b6d4);
    --grad-text: linear-gradient(135deg,#fff 20%,#a5b4fc 60%,#67e8f9 100%);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Segoe UI',Tahoma,system-ui,sans-serif;
    background:var(--bg);color:var(--txt);
    min-height:100vh;overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:rgba(99,102,241,.35)}
  a{color:var(--p1);text-decoration:none;cursor:pointer}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,textarea,select{font-family:inherit}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:var(--bg-2)}
  ::-webkit-scrollbar-thumb{background:#2a3356;border-radius:10px}
  ::-webkit-scrollbar-thumb:hover{background:#3a4570}

  /* ================= Animated Background ================= */
  .orbs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.55;animation:float 20s ease-in-out infinite}
  .orb.a{width:500px;height:500px;background:#6366f1;top:-120px;right:-100px}
  .orb.b{width:450px;height:450px;background:#a855f7;bottom:-100px;left:-80px;animation-delay:-7s}
  .orb.c{width:380px;height:380px;background:#06b6d4;top:40%;left:40%;animation-delay:-14s;opacity:.3}
  @keyframes float{
    0%,100%{transform:translate(0,0) scale(1)}
    33%    {transform:translate(60px,-40px) scale(1.1)}
    66%    {transform:translate(-40px,60px) scale(.95)}
  }
  .grid-bg{
    position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:
      linear-gradient(rgba(99,102,241,.05) 1px,transparent 1px),
      linear-gradient(90deg,rgba(99,102,241,.05) 1px,transparent 1px);
    background-size:40px 40px;
    mask-image:radial-gradient(ellipse at center,black 30%,transparent 80%);
    -webkit-mask-image:radial-gradient(ellipse at center,black 30%,transparent 80%);
  }

  /* ================= Layout ================= */
  .app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}

  @keyframes fadeUp{
    from{opacity:0;transform:translateY(12px)}
    to  {opacity:1;transform:translateY(0)}
  }
  @keyframes pulse{
    0%,100%{box-shadow:0 8px 24px rgba(99,102,241,.45)}
    50%    {box-shadow:0 8px 32px rgba(99,102,241,.75)}
  }
  @keyframes blink{50%{opacity:.3}}
  @keyframes bob{
    0%,100%{transform:translateY(0)}
    50%    {transform:translateY(-14px)}
  }
  @keyframes slideIn{
    from{opacity:0;transform:translateX(-20px)}
    to  {opacity:1;transform:translateX(0)}
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ================= Brand ================= */
  .brand{
    display:flex;align-items:center;gap:12px;
    font-weight:800;font-size:20px;cursor:pointer;
  }
  .brand-icon{
    width:38px;height:38px;border-radius:12px;
    background:var(--grad);
    display:grid;place-items:center;font-size:20px;
    box-shadow:0 8px 24px rgba(99,102,241,.45);
    animation:pulse 3s ease-in-out infinite;
    flex-shrink:0;
  }
  .brand-text{
    background:var(--grad-text);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
  }

  /* ================= Top Nav ================= */
  .topnav{
    position:sticky;top:0;z-index:50;
    display:flex;justify-content:space-between;align-items:center;
    padding:16px 32px;
    background:rgba(7,9,26,.7);
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border-bottom:1px solid var(--border);
    visibility:hidden;opacity:0;pointer-events:none;
    transition:opacity .3s ease,visibility .3s ease;
  }
  .topnav.show{visibility:visible;opacity:1;pointer-events:auto}

  .nav-links{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .nav-link{
    padding:10px 18px;border-radius:10px;
    font-size:14px;font-weight:600;color:var(--dim);
    transition:all .2s;
  }
  .nav-link:hover{color:var(--txt);background:var(--card)}
  .nav-link.primary{
    background:var(--grad);color:#fff;
    box-shadow:0 6px 18px rgba(99,102,241,.35);
  }
  .nav-link.primary:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 28px rgba(99,102,241,.5);
  }

  /* ================= Sidebar ================= */
  .layout{display:none;flex:1}
  .layout.show{display:grid;grid-template-columns:260px 1fr}

  .sidebar{
    background:rgba(13,18,36,.6);
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border-left:1px solid var(--border);
    padding:22px 16px;
    position:sticky;top:0;height:100vh;
    display:flex;flex-direction:column;gap:6px;
  }
  .sidebar .brand{margin-bottom:24px;padding:0 6px}

  .side-item{
    display:flex;align-items:center;gap:12px;
    padding:12px 14px;border-radius:12px;
    color:var(--dim);font-weight:600;font-size:14px;
    transition:all .2s;cursor:pointer;position:relative;
  }
  .side-item:hover{background:var(--card);color:var(--txt)}
  .side-item.active{
    background:linear-gradient(135deg,rgba(99,102,241,.2),rgba(168,85,247,.15));
    color:#fff;
    border:1px solid rgba(99,102,241,.3);
  }
  .side-item.active::before{
    content:'';position:absolute;right:-16px;top:20%;bottom:20%;
    width:3px;background:var(--grad);border-radius:3px;
  }
  .side-item .ico{font-size:18px;width:24px;text-align:center}
  .side-spacer{flex:1}

  .side-user{
    background:var(--card);border:1px solid var(--border);
    border-radius:12px;padding:12px 14px;
    display:flex;align-items:center;gap:10px;margin-bottom:8px;
  }
  .avatar{
    width:36px;height:36px;border-radius:10px;
    background:var(--grad);
    display:grid;place-items:center;
    font-weight:700;font-size:14px;color:#fff;flex-shrink:0;
  }
  .side-user .meta{min-width:0;overflow:hidden}
  .side-user .name{
    font-weight:700;font-size:14px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .side-user .status{
    font-size:11px;color:var(--ok);
    display:flex;align-items:center;gap:5px;
  }
  .side-user .dot{
    width:6px;height:6px;border-radius:50%;
    background:var(--ok);box-shadow:0 0 8px var(--ok);
  }

  /* ================= Main ================= */
  .main{padding:32px 40px;min-width:0;animation:fadeUp .4s ease both}

  /* ================= Typography ================= */
  h1{font-size:clamp(32px,5vw,56px);font-weight:800;line-height:1.15;letter-spacing:-.02em}
  h2{font-size:clamp(24px,3vw,36px);font-weight:800;line-height:1.2;letter-spacing:-.01em}
  h3{font-size:20px;font-weight:700}
  h4{font-size:16px;font-weight:700;margin-bottom:8px}
  p{line-height:1.7}
  .dim{color:var(--dim)}
  .grad-text{
    background:var(--grad-text);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
  }
  .grad-text-2{
    background:var(--grad-3);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
  }

  /* ================= Buttons ================= */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:12px 22px;border-radius:12px;
    font-weight:600;font-size:14px;
    transition:all .2s;white-space:nowrap;
  }
  .btn-primary{
    background:var(--grad);color:#fff;
    box-shadow:0 8px 24px rgba(99,102,241,.35);
  }
  .btn-primary:hover:not(:disabled){
    transform:translateY(-2px);
    box-shadow:0 14px 32px rgba(99,102,241,.55);
  }
  .btn-primary:disabled{opacity:.55;cursor:not-allowed;transform:none}
  .btn-ghost{
    background:var(--card);border:1px solid var(--border);color:var(--txt);
  }
  .btn-ghost:hover{border-color:var(--p1);background:rgba(99,102,241,.08)}
  .btn-danger{
    background:rgba(239,68,68,.12);color:#fca5a5;
    border:1px solid rgba(239,68,68,.3);
  }
  .btn-danger:hover{background:rgba(239,68,68,.22)}
  .btn-lg{padding:16px 32px;font-size:16px;border-radius:14px}
  .btn-sm{padding:8px 14px;font-size:12px;border-radius:8px}

  .spinner{
    display:inline-block;width:14px;height:14px;
    border:2px solid rgba(255,255,255,.3);
    border-top-color:#fff;border-radius:50%;
    animation:spin .7s linear infinite;
  }

  /* ================= Cards ================= */
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:20px;padding:26px;
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    transition:all .3s;
  }
  .card.hover:hover{border-color:rgba(99,102,241,.35);transform:translateY(-4px)}

  /* ================= Forms ================= */
  .field{margin-bottom:16px}
  .field label{
    display:block;font-size:13px;color:var(--dim);
    margin-bottom:8px;font-weight:600;
  }
  .input{
    width:100%;padding:14px 16px;
    background:var(--bg-2);border:1px solid var(--border);
    border-radius:12px;color:var(--txt);font-size:15px;
    outline:none;transition:all .2s;
  }
  .input:focus{
    border-color:var(--p1);
    box-shadow:0 0 0 4px rgba(99,102,241,.15);
    background:var(--bg-3);
  }
  .input::placeholder{color:#5a6384}
  .input:disabled{opacity:.5;cursor:not-allowed}

  /* ================= Alert ================= */
  .alert{
    padding:14px 18px;border-radius:12px;font-size:14px;
    margin-bottom:16px;display:none;border:1px solid;
  }
  .alert.show{display:block;animation:fadeUp .3s ease}
  .alert.ok  {background:rgba(16,185,129,.1);border-color:rgba(16,185,129,.3);color:#6ee7b7}
  .alert.err {background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.3);color:#fca5a5}
  .alert.info{background:rgba(99,102,241,.1);border-color:rgba(99,102,241,.3);color:#a5b4fc}

  /* ================= Landing — Hero ================= */
  .hero{
    max-width:1200px;margin:0 auto;padding:80px 32px 60px;
    display:grid;grid-template-columns:1.2fr 1fr;gap:60px;align-items:center;
  }
  .hero .badge{
    display:inline-flex;align-items:center;gap:8px;
    padding:8px 14px;
    border:1px solid rgba(99,102,241,.3);border-radius:999px;
    background:rgba(99,102,241,.08);
    font-size:13px;color:#a5b4fc;font-weight:600;
    margin-bottom:20px;
  }
  .hero .badge .dot{
    width:6px;height:6px;border-radius:50%;
    background:#4ade80;box-shadow:0 0 8px #4ade80;
    animation:blink 1.5s infinite;
  }
  .hero h1{margin-bottom:20px}
  .hero .lead{
    font-size:18px;color:var(--dim);
    margin-bottom:32px;max-width:560px;
  }
  .hero-cta{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:40px}
  .hero-stats{display:flex;gap:32px;flex-wrap:wrap}
  .hero-stats .stat{text-align:right}
  .hero-stats .num{
    font-size:28px;font-weight:800;
    background:var(--grad-3);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
  }
  .hero-stats .lbl{font-size:12px;color:var(--dim)}

  .hero-visual{position:relative;height:420px;perspective:1200px}
  .float-card{
    position:absolute;
    background:var(--card);border:1px solid var(--border);
    border-radius:20px;padding:20px;
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    box-shadow:0 20px 60px rgba(0,0,0,.4);
  }
  .float-card .fc-header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .float-card .fc-title{font-weight:700;font-size:14px}
  .float-card .fc-icon{
    width:32px;height:32px;border-radius:9px;background:var(--grad);
    display:grid;place-items:center;font-size:16px;
  }
  .fc-1{top:20px;right:20px;width:280px;animation:bob 5s ease-in-out infinite}
  .fc-2{top:180px;left:0;width:260px;animation:bob 5s ease-in-out infinite .8s}
  .fc-3{bottom:20px;right:60px;width:240px;animation:bob 5s ease-in-out infinite 1.6s}
  .fake-line{height:8px;background:var(--bg-3);border-radius:4px;margin-bottom:8px}
  .fake-line.short{width:60%}

  /* ================= Landing — Sections ================= */
  .section{max-width:1200px;margin:0 auto;padding:60px 32px}
  .section-head{text-align:center;margin-bottom:50px}
  .section-head h2{margin-bottom:14px}
  .section-head p{color:var(--dim);font-size:16px;max-width:600px;margin:0 auto}

  .features{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:20px;
  }
  .feat{
    background:var(--card);border:1px solid var(--border);
    border-radius:20px;padding:28px;
    transition:all .3s;position:relative;overflow:hidden;
  }
  .feat:hover{
    transform:translateY(-6px);
    border-color:rgba(99,102,241,.4);
    box-shadow:0 20px 40px rgba(99,102,241,.15);
  }
  .feat-ico{
    width:52px;height:52px;border-radius:14px;
    background:var(--grad);
    display:grid;place-items:center;font-size:24px;
    margin-bottom:18px;
    box-shadow:0 10px 24px rgba(99,102,241,.35);
  }
  .feat h3{margin-bottom:10px}
  .feat p{color:var(--dim);font-size:14px}

  .why-grid{
    display:grid;grid-template-columns:1fr 1fr;
    gap:40px;align-items:center;
  }
  .why-list{display:flex;flex-direction:column;gap:18px}
  .why-item{
    display:flex;gap:14px;padding:18px;
    background:var(--card);border:1px solid var(--border);
    border-radius:14px;transition:all .2s;
  }
  .why-item:hover{border-color:rgba(99,102,241,.35);transform:translateX(-4px)}
  .why-item .check{
    width:32px;height:32px;border-radius:10px;
    background:var(--grad-3);
    display:grid;place-items:center;color:#fff;font-weight:700;
    flex-shrink:0;
  }
  .why-item h4{margin-bottom:4px}
  .why-item p{color:var(--dim);font-size:13px}

  /* ================= Auth ================= */
  .auth-wrap{
    display:grid;place-items:center;
    padding:60px 24px;
    min-height:calc(100vh - 72px);
  }
  .auth-card{
    width:100%;max-width:440px;
    background:var(--card);
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border:1px solid var(--border);
    border-radius:24px;padding:40px 36px;
    box-shadow:0 30px 80px rgba(0,0,0,.4);
  }
  .auth-card .head{text-align:center;margin-bottom:28px}
  .auth-card .head h2{font-size:26px;margin-bottom:8px}
  .auth-card .head p{color:var(--dim);font-size:14px}
  .auth-card .switch{
    margin-top:20px;text-align:center;
    font-size:14px;color:var(--dim);
  }
  .auth-card .switch a{color:#a5b4fc;font-weight:600}

  /* ================= Dashboard ================= */
  .page-head{margin-bottom:28px}
  .page-head h2{margin-bottom:6px}
  .page-head p{color:var(--dim);font-size:14px}

  .stats{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:16px;margin-bottom:24px;
  }
  .stat-card{
    background:var(--card);border:1px solid var(--border);
    border-radius:18px;padding:22px;
    transition:all .3s;
  }
  .stat-card:hover{transform:translateY(-3px);border-color:rgba(99,102,241,.35)}
  .stat-card .sc-ico{
    width:44px;height:44px;border-radius:12px;
    background:var(--grad);
    display:grid;place-items:center;font-size:22px;
    margin-bottom:14px;
  }
  .stat-card .sc-val{font-size:28px;font-weight:800;margin-bottom:4px}
  .stat-card .sc-lbl{color:var(--dim);font-size:13px}

  .quick-actions{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:14px;margin-bottom:24px;
  }
  .qa{
    background:var(--card);border:1px solid var(--border);
    border-radius:16px;padding:20px;
    display:flex;flex-direction:column;gap:10px;
    transition:all .2s;cursor:pointer;
  }
  .qa:hover{
    background:rgba(99,102,241,.1);
    border-color:var(--p1);
    transform:translateY(-3px);
  }
  .qa .qa-ico{font-size:26px}
  .qa .qa-title{font-weight:700;font-size:15px}
  .qa .qa-desc{color:var(--dim);font-size:12px}

  /* ================= Files ================= */
  .files-head{
    display:flex;justify-content:space-between;align-items:center;
    gap:16px;margin-bottom:20px;flex-wrap:wrap;
  }
  .search{position:relative;flex:1;max-width:340px}
  .search input{padding-right:42px}
  .search .s-ico{
    position:absolute;right:14px;top:50%;
    transform:translateY(-50%);color:var(--dim);
    pointer-events:none;
  }

  .file-row{
    display:flex;align-items:center;justify-content:space-between;
    gap:16px;padding:16px 20px;
    background:var(--card);border:1px solid var(--border);
    border-radius:14px;margin-bottom:10px;
    transition:all .2s;
  }
  .file-row:hover{border-color:rgba(99,102,241,.35);transform:translateX(-4px)}
  .file-left{display:flex;align-items:center;gap:14px;min-width:0;flex:1}
  .file-thumb{
    width:44px;height:44px;border-radius:12px;
    background:var(--grad-3);
    display:grid;place-items:center;font-size:20px;
    flex-shrink:0;
  }
  .file-info{min-width:0}
  .file-name{
    font-weight:700;font-size:15px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    margin-bottom:2px;
  }
  .file-sub{font-size:12px;color:var(--dim)}
  .file-actions{display:flex;gap:6px;flex-shrink:0}
  .icon-btn{
    width:38px;height:38px;border-radius:10px;
    background:var(--bg-2);border:1px solid var(--border);
    display:grid;place-items:center;
    transition:all .2s;font-size:16px;
  }
  .icon-btn:hover{
    background:rgba(99,102,241,.15);
    border-color:var(--p1);
    transform:scale(1.05);
  }
  .icon-btn.danger:hover{
    background:rgba(239,68,68,.15);
    border-color:var(--err);
  }

  /* ================= Upload ================= */
  .dropzone{
    border:2px dashed rgba(99,102,241,.3);
    border-radius:20px;padding:60px 24px;
    text-align:center;cursor:pointer;
    transition:all .3s;
    background:linear-gradient(180deg,rgba(99,102,241,.03),transparent);
  }
  .dropzone:hover,.dropzone.drag{
    border-color:var(--p1);
    background:rgba(99,102,241,.08);
    transform:scale(1.005);
  }
  .dropzone .dz-ico{
    font-size:60px;margin-bottom:16px;
    display:inline-block;
    animation:bob 3s ease-in-out infinite;
  }
  .dropzone h3{margin-bottom:8px}
  .dropzone p{color:var(--dim);font-size:14px}

  .progress{
    height:8px;background:var(--bg-2);border-radius:999px;
    overflow:hidden;margin-top:16px;display:none;
  }
  .progress.show{display:block}
  .progress-bar{
    height:100%;background:var(--grad);
    width:0%;transition:width .3s;border-radius:999px;
  }

  .upload-item{
    display:flex;align-items:center;gap:14px;
    padding:14px 18px;
    background:var(--card);border:1px solid var(--border);
    border-radius:12px;margin-top:10px;
  }
  .upload-item .ui-ico{font-size:22px}
  .upload-item .ui-info{flex:1;min-width:0}
  .upload-item .ui-name{
    font-weight:600;font-size:14px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .upload-item .ui-status{font-size:12px;color:var(--dim);margin-top:2px}
  .upload-item.ok  .ui-status{color:var(--ok)}
  .upload-item.err .ui-status{color:var(--err)}

  /* ================= Docs ================= */
  pre{
    background:#05070f;border:1px solid var(--border);
    border-radius:14px;padding:20px;
    overflow-x:auto;
    font-family:'Consolas','Monaco',monospace;
    font-size:13px;line-height:1.7;
    direction:ltr;text-align:left;

<script>
/* ================================================================
   إعدادات عامة
   ================================================================ */
const DEFAULT_API = "https://divinity-maritime-perfume.ngrok-free.dev";
const HEADERS = { "ngrok-skip-browser-warning": "true" };

const state = {
  token: null,
  username: null,
  apiBase: localStorage.getItem("zc_api") || DEFAULT_API,
  files: [],
  page: "home",
};

/* ================================================================
   أدوات مساعدة
   ================================================================ */
const $  = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => [...root.querySelectorAll(sel)];

function toast(msg, type="info", ms=3500){
  const el = document.createElement("div");
  el.className = "toast " + type;
  const ico = type === "ok" ? "✅" : type === "err" ? "❌" : "ℹ️";
  el.innerHTML = `<span>${ico}</span><span>${escapeHtml(msg)}</span>`;
  $("#toasts").appendChild(el);
  setTimeout(() => {
    el.style.transition = "opacity .3s, transform .3s";
    el.style.opacity = "0";
    el.style.transform = "translateX(-20px)";
    setTimeout(() => el.remove(), 300);
  }, ms);
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])
  );
}

function fmtSize(b){
  if (!b) return "0 B";
  if (b < 1024) return b + " B";
  if (b < 1048576) return (b/1024).toFixed(1) + " KB";
  if (b < 1073741824) return (b/1048576).toFixed(2) + " MB";
  return (b/1073741824).toFixed(2) + " GB";
}

function saveState(){
  localStorage.setItem("zc_state", JSON.stringify({
    token: state.token, username: state.username
  }));
  localStorage.setItem("zc_api", state.apiBase);
}

function loadState(){
  try{
    const s = JSON.parse(localStorage.getItem("zc_state") || "{}");
    if (s.token){ state.token = s.token; state.username = s.username; }
  }catch(e){}
}

/* ================================================================
   API
   ================================================================ */
async function api(path, body, isForm = false){
  const opt = { method: "POST", headers: { ...HEADERS } };
  if (isForm){
    opt.body = body;
  } else {
    opt.headers["Content-Type"] = "application/json";
    opt.body = JSON.stringify(body || {});
  }
  const r = await fetch(state.apiBase.replace(/\/$/, "") + path, opt);
  return await r.json();
}

/* ================================================================
   Router
   ================================================================ */
function go(page){
  state.page = page;
  window.scrollTo({ top: 0, behavior: "smooth" });
  render();
}

function render(){
  const isAuthed = !!state.token;
  const publicPages = ["home", "login", "register", "docs"];

  $("#topnav").classList.toggle("show", !isAuthed);
  $("#layout").classList.toggle("show", isAuthed);
  $("#publicContent").style.display = isAuthed ? "none" : "block";

  $$(".side-item").forEach(el =>
    el.classList.toggle("active", el.dataset.page === state.page)
  );

  if (isAuthed){
    $("#sideUserName").textContent = state.username || "-";
    $("#userAvatar").textContent = (state.username || "?")[0].toUpperCase();
  }

  if (!isAuthed){
    if (!publicPages.includes(state.page)) state.page = "home";
    $("#publicContent").innerHTML = renderPage(state.page);
  } else {
    const authedPages = ["dashboard", "files", "upload", "docs", "settings"];
    if (!authedPages.includes(state.page)) state.page = "dashboard";
    $("#pageContainer").innerHTML = renderPage(state.page);
    if (state.page === "dashboard" || state.page === "files") loadFiles();
    if (state.page === "upload") initUploadPage();
  }

  requestAnimationFrame(() => {
    $$("[data-anim]").forEach((el, i) => {
      el.style.opacity = "0";
      el.style.transform = "translateY(12px)";
      setTimeout(() => {
        el.style.transition = "opacity .5s, transform .5s";
        el.style.opacity = "1";
        el.style.transform = "translateY(0)";
      }, 60 * i);
    });
  });
}

/* ================================================================
   Pages
   ================================================================ */
function renderPage(page){
  switch(page){
    case "home":      return pageHome();
    case "login":     return pageLogin();
    case "register":  return pageRegister();
    case "dashboard": return pageDashboard();
    case "files":     return pageFiles();
    case "upload":    return pageUpload();
    case "docs":      return pageDocs();
    case "settings":  return pageSettings();
    default:          return pageHome();
  }
}

/* -------------------- Docs -------------------- */
function pageDocs(){
  return `
    <div class="page-head" data-anim>
      <h2>📚 دليل الـ API</h2>
      <p>اربط سكربتك بـ ZoneCloud في دقائق</p>
    </div>

    <div class="card" data-anim style="margin-bottom:20px">
      <h3 style="margin-bottom:12px">🌐 Base URL</h3>
      <div class="token-box">
        <span class="tkn">${escapeHtml(state.apiBase)}</span>
        <button class="copy-btn" style="position:static" onclick="copyText('${state.apiBase}')">نسخ</button>
      </div>
      <p class="dim" style="margin-top:10px;font-size:13px">
        ⚠️ لو العنوان اتغيّر، عدّله من <a onclick="go('settings')" style="color:#a5b4fc">الإعدادات</a>
      </p>
    </div>

    <h3 data-anim style="margin:28px 0 16px">Endpoints</h3>
    <div data-anim>
      ${[
        {m:"POST", p:"/register", d:"إنشاء حساب جديد — يرجع token"},
        {m:"POST", p:"/login",    d:"تسجيل دخول — يرجع token"},
        {m:"POST", p:"/upload",   d:"رفع ملف (multipart) مع token"},
        {m:"POST", p:"/myfiles",  d:"عرض ملفات المستخدم"},
        {m:"POST", p:"/download", d:"تنزيل ملف — يرجع binary"},
        {m:"POST", p:"/delete",   d:"حذف ملف"},
        {m:"POST", p:"/rename",   d:"إعادة تسمية ملف"}
      ].map(e => `
        <div class="endpoint">
          <span class="method post">${e.m}</span>
          <div>
            <div class="ep-path">${e.p}</div>
            <div class="ep-desc">${e.d}</div>
          </div>
          <span style="color:var(--dim)">→</span>
        </div>
      `).join("")}
    </div>

    <h3 data-anim style="margin:32px 0 16px">🧪 سكربت Python جاهز</h3>
    <div data-anim>
      <pre><span class="code-lang">python</span><span class="kw">import</span> requests

BASE = <span class="str">"${state.apiBase}"</span>
HEADERS = {<span class="str">"ngrok-skip-browser-warning"</span>: <span class="str">"true"</span>}


<span class="kw">class</span> <span class="fn">ZoneCloud</span>:
    <span class="kw">def</span> <span class="fn">__init__</span>(self, base):
        self.base = base.rstrip(<span class="str">"/"</span>)
        self.s = requests.Session()
        self.s.headers.update(HEADERS)
        self.token = <span class="kw">None</span>

    <span class="kw">def</span> <span class="fn">register</span>(self, u, p):
        d = self.s.post(<span class="str">f"{self.base}/register"</span>,
                        json={<span class="str">"username"</span>:u,<span class="str">"password"</span>:p}).json()
        <span class="kw">if</span> d.get(<span class="str">"ok"</span>): self.token = d[<span class="str">"token"</span>]
        <span class="kw">return</span> d

    <span class="kw">def</span> <span class="fn">login</span>(self, u, p):
        d = self.s.post(<span class="str">f"{self.base}/login"</span>,
                        json={<span class="str">"username"</span>:u,<span class="str">"password"</span>:p}).json()
        <span class="kw">if</span> d.get(<span class="str">"ok"</span>): self.token = d[<span class="str">"token"</span>]
        <span class="kw">return</span> d

    <span class="kw">def</span> <span class="fn">upload</span>(self, path):
        <span class="kw">with</span> open(path, <span class="str">"rb"</span>) <span class="kw">as</span> f:
            <span class="kw">return</span> self.s.post(<span class="str">f"{self.base}/upload"</span>,
                data={<span class="str">"token"</span>: self.token},
                files={<span class="str">"file"</span>: f}).json()

    <span class="kw">def</span> <span class="fn">myfiles</span>(self):
        <span class="kw">return</span> self.s.post(<span class="str">f"{self.base}/myfiles"</span>,
            json={<span class="str">"token"</span>: self.token}).json()

    <span class="kw">def</span> <span class="fn">download</span>(self, name, save=<span class="kw">None</span>):
        r = self.s.post(<span class="str">f"{self.base}/download"</span>,
            json={<span class="str">"token"</span>: self.token, <span class="str">"filename"</span>: name})
        <span class="kw">if</span> r.status_code == <span class="num">200</span>:
            open(save <span class="kw">or</span> name, <span class="str">"wb"</span>).write(r.content)
            <span class="kw">return</span> {<span class="str">"ok"</span>: <span class="kw">True</span>}
        <span class="kw">return</span> r.json()

    <span class="kw">def</span> <span class="fn">delete</span>(self, name):
        <span class="kw">return</span> self.s.post(<span class="str">f"{self.base}/delete"</span>,
            json={<span class="str">"token"</span>: self.token, <span class="str">"filename"</span>: name}).json()

    <span class="kw">def</span> <span class="fn">rename</span>(self, old, new):
        <span class="kw">return</span> self.s.post(<span class="str">f"{self.base}/rename"</span>,
            json={<span class="str">"token"</span>: self.token,
                  <span class="str">"filename"</span>: old, <span class="str">"new_name"</span>: new}).json()


<span class="com"># ----- تجربة سريعة -----</span>
<span class="kw">if</span> __name__ == <span class="str">"__main__"</span>:
    zc = ZoneCloud(BASE)
    <span class="fn">print</span>(zc.register(<span class="str">"test_user"</span>, <span class="str">"pass1234"</span>))
    <span class="fn">print</span>(zc.upload(<span class="str">"test.txt"</span>))
    <span class="fn">print</span>(zc.myfiles())
<button class="copy-btn" onclick="copyCode(this)">نسخ</button></pre>
    </div>
  `;
}

/* -------------------- Settings -------------------- */
function pageSettings(){
  return `
    <div class="page-head" data-anim>
      <h2>⚙️ الإعدادات</h2>
      <p>إدارة الحساب والاتصال</p>
    </div>

    <h3 data-anim style="margin-bottom:14px">الحساب</h3>
    <div class="setting-row" data-anim>
      <div class="sr-info">
        <h4>👤 اسم المستخدم</h4>
        <p>${escapeHtml(state.username || "-")}</p>
      </div>
    </div>

    <div class="setting-row" data-anim>
      <div class="sr-info">
        <h4>🔑 التوكن (Token)</h4>
        <p>مفتاح الوصول لملفاتك — حافظ عليه ولا تشاركه</p>
      </div>
    </div>
    <div class="token-box" data-anim style="margin-bottom:20px">
      <span class="tkn" id="settingsToken">${escapeHtml(state.token || "")}</span>
      <button class="copy-btn" style="position:static" onclick="copyText(state.token)">نسخ</button>
      <button class="copy-btn" style="position:static" onclick="toggleToken()" id="toggleTkn">إخفاء</button>
    </div>

    <h3 data-anim style="margin:28px 0 14px">الاتصال</h3>
    <div class="setting-row" data-anim>
      <div class="sr-info">
        <h4>🌐 API Base URL</h4>
        <p>رابط السيرفر — عدّله لو العنوان اتغيّر</p>
      </div>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px" data-anim>
      <input class="input" id="apiBaseInput" value="${escapeHtml(state.apiBase)}" style="flex:1;min-width:240px">
      <button class="btn btn-primary" onclick="saveApiBase()">💾 حفظ</button>
      <button class="btn btn-ghost" onclick="testApi()">🔍 اختبار</button>
    </div>

    <h3 data-anim style="margin:28px 0 14px">منطقة الخطر</h3>
    <div class="setting-row" data-anim>
      <div class="sr-info">
        <h4>🚪 تسجيل الخروج</h4>
        <p>هيتم حذف الجلسة من المتصفح (الملفات تفضل آمنة على السيرفر)</p>

/* ================================================================
   Actions
   ================================================================ */
async function doLogin(){
  const btn = $("#loginBtn");
  const u = $("#loginUser").value.trim();
  const p = $("#loginPass").value;
  if (!u || !p) return toast("املأ كل الحقول", "err");

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> جاري...';

  try{
    const d = await api("/login", { username: u, password: p });
    if (d.ok){
      state.token = d.token;
      state.username = d.username;
      saveState();
      toast("مرحبًا " + d.username, "ok");
      go("dashboard");
      return;
    }
    const extra = (d.attempts_left !== undefined) ? ` (محاولات متبقية: ${d.attempts_left})` : "";
    toast((d.error || "فشل الدخول") + extra, "err");
  } catch(e){
    toast("خطأ: " + e.message, "err");
  } finally {
    btn.disabled = false;
    btn.textContent = "🔑 دخول";
  }
}

async function doRegister(){
  const btn = $("#regBtn");
  const u = $("#regUser").value.trim();
  const p = $("#regPass").value;
  if (!u || !p) return toast("املأ كل الحقول", "err");

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> جاري...';

  try{
    const d = await api("/register", { username: u, password: p });
    if (d.ok){
      state.token = d.token;
      state.username = d.username;
      saveState();
      toast("تم إنشاء الحساب 🎉", "ok");
      go("dashboard");
      return;
    }
    toast(d.error || "فشل التسجيل", "err");
  } catch(e){
    toast("خطأ: " + e.message, "err");
  } finally {
    btn.disabled = false;
    btn.textContent = "🚀 إنشاء الحساب";
  }
}

function logout(){
  state.token = null;
  state.username = null;
  state.files = [];
  localStorage.removeItem("zc_state");
  toast("تم تسجيل الخروج", "info");
  go("home");
}

async function loadFiles(){
  if (!state.token) return;
  try{
    const d = await api("/myfiles", { token: state.token });
    if (!d.ok){
      toast(d.error || "فشل تحميل الملفات", "err");
      return;
    }
    state.files = d.files || [];
    const totalSize = state.files.reduce((s, f) => s + (f.size || 0), 0);
    const el1 = $("#statFiles"); if (el1) el1.textContent = state.files.length;
    const el2 = $("#statSize");  if (el2) el2.textContent = fmtSize(totalSize);
    renderFilesList();
    renderRecent();
  } catch(e){
    toast("خطأ: " + e.message, "err");
  }
}

function renderFilesList(filter=""){
  const list = $("#filesFullList");
  if (!list) return;
  const f = filter.toLowerCase();
  const items = state.files.filter(x => !f || x.filename.toLowerCase().includes(f));
  if (!items.length){
    list.innerHTML = `<div class="empty"><div class="e-ico">📭</div><p>${f ? "مفيش نتائج" : "لسه مرفعتش أي ملف"}</p></div>`;
    return;
  }
  list.innerHTML = items.map(fileRow).join("");
}

function renderRecent(){
  const wrap = $("#recentFiles");
  if (!wrap) return;
  const items = state.files.slice(0, 4);
  if (!items.length){
    wrap.innerHTML = `<div class="empty"><div class="e-ico">📭</div><p>لسه مرفعتش أي ملف — <a onclick="go('upload')">ارفع أول ملف</a></p></div>`;
    return;
  }
  wrap.innerHTML = items.map(fileRow).join("");
}

function fileRow(f){
  const name = escapeHtml(f.filename);
  const arg = JSON.stringify(f.filename).replace(/"/g, "&quot;");
  return `
    <div class="file-row">
      <div class="file-left">
        <div class="file-thumb">📄</div>
        <div class="file-info">
          <div class="file-name">${name}</div>
          <div class="file-sub">${fmtSize(f.size)} · ${new Date(f.uploaded_at).toLocaleDateString("ar-EG")}</div>
        </div>
      </div>
      <div class="file-actions">
        <button class="icon-btn" onclick="downloadFile(${arg})" title="تنزيل">📥</button>
        <button class="icon-btn" onclick="renameFile(${arg})" title="إعادة تسمية">✏️</button>
        <button class="icon-btn danger" onclick="deleteFile(${arg})" title="حذف">🗑</button>
      </div>
    </div>
  `;
}

function filterFiles(v){ renderFilesList(v); }

async function downloadFile(filename){
  try{
    const r = await fetch(state.apiBase.replace(/\/$/, "") + "/download", {
      method: "POST",
      headers: { ...HEADERS, "Content-Type": "application/json" },
      body: JSON.stringify({ token: state.token, filename })
    });
    if (r.status !== 200){
      const d = await r.json().catch(() => ({}));
      return toast(d.error || "فشل التنزيل", "err");
    }
    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename; a.click();
    URL.revokeObjectURL(url);
    toast("تم التنزيل ✅", "ok");
  } catch(e){
    toast("خطأ: " + e.message, "err");
  }
}

async function deleteFile(filename){
  if (!confirm(`تأكيد حذف "${filename}"؟`)) return;
  try{
    const d = await api("/delete", { token: state.token, filename });
    if (d.ok){
      toast("تم الحذف 🗑", "ok");
      loadFiles();
    } else {
      toast(d.error || "فشل الحذف", "err");
    }
  } catch(e){
    toast("خطأ: " + e.message, "err");
  }
}

async function renameFile(filename){
  const nn = prompt("الاسم الجديد:", filename);
  if (!nn || nn === filename) return;
  try{
    const d = await api("/rename", { token: state.token, filename, new_name: nn });
    if (d.ok){
      toast("تم التعديل ✏️", "ok");
      loadFiles();
    } else {
      toast(d.error || "فشل التعديل", "err");
    }
  } catch(e){
    toast("خطأ: " + e.message, "err");
  }
}

/* -------------------- Upload -------------------- */
function initUploadPage(){
  const dz = $("#dropzone");
  const fi = $("#fileInput");
  if (!dz || !fi) return;
  dz.addEventListener("click", () => fi.click());
  dz.addEventListener("dragover", e => { e.preventDefault(); dz.classList.add("drag"); });
  dz.addEventListener("dragleave", () => dz.classList.remove("drag"));
  dz.addEventListener("drop", e => {
    e.preventDefault(); dz.classList.remove("drag");
    if (e.dataTransfer.files.length) uploadFile(e.dataTransfer.files[0]);
  });
  fi.addEventListener("change", () => {
    if (fi.files.length) uploadFile(fi.files[0]);
  });
}

function uploadFile(file){
  const queue = $("#uploadQueue");
  const item = document.createElement("div");
  item.className = "upload-item";
  item.innerHTML = `
    <div class="ui-ico">📄</div>
    <div class="ui-info">
      <div class="ui-name">${escapeHtml(file.name)}</div>
      <div class="ui-status">جاري الرفع...</div>
    </div>
  `;
  queue.prepend(item);

  const prog = $("#progress");
  const bar = $("#progressBar");
  prog.classList.add("show");
  bar.style.width = "0%";

  const fd = new FormData();
  fd.append("token", state.token);
  fd.append("file", file);

  const xhr = new XMLHttpRequest();
  xhr.upload.onprogress = e => {
    if (e.lengthComputable) bar.style.width = (e.loaded / e.total * 100) + "%";
  };
  xhr.onload = () => {
    prog.classList.remove("show");
    try{
      const d = JSON.parse(xhr.responseText);
      if (d.ok){
        item.classList.add("ok");
        item.querySelector(".ui-status").textContent = `✅ تم الرفع · ${fmtSize(d.size)}`;
        toast("تم رفع: " + d.filename, "ok");
        loadFiles();
      } else {
        item.classList.add("err");
        item.querySelector(".ui-status").textContent = "❌ " + (d.error || "فشل");
        toast(d.error || "فشل الرفع", "err");
      }
    } catch(e){
      item.classList.add("err");
      item.querySelector(".ui-status").textContent = "❌ رد غير متوقع";
    }
  };
  xhr.onerror = () => {
    prog.classList.remove("show");
    item.classList.add("err");
    item.querySelector(".ui-status").textContent = "❌ فشل الاتصال";
  };
  xhr.open("POST", state.apiBase.replace(/\/$/, "") + "/upload");
  xhr.setRequestHeader("ngrok-skip-browser-warning", "true");
  xhr.send(fd);
}

/* -------------------- Settings -------------------- */
function copyText(t){
  navigator.clipboard.writeText(t).then(() => toast("تم النسخ ✅", "ok"));
}

function copyCode(btn){
  const pre = btn.parentElement;
  const clone = pre.cloneNode(true);
  clone.querySelectorAll(".copy-btn,.code-lang").forEach(x => x.remove());
  navigator.clipboard.writeText(clone.innerText).then(() => {
    const old = btn.textContent;
    btn.textContent = "✓ تم";
    setTimeout(() => btn.textContent = old, 1500);
  });
}

function toggleToken(){
  const el = $("#settingsToken");
  const btn = $("#toggleTkn");
  if (!el) return;
  if (el.dataset.hidden === "1"){
    el.textContent = state.token;
    el.dataset.hidden = "0";
    btn.textContent = "إخفاء";
  } else {
    el.textContent = "•".repeat(40);
    el.dataset.hidden = "1";
    btn.textContent = "إظهار";
  }
}

function saveApiBase(){
  const v = $("#apiBaseInput").value.trim();
  if (!v) return toast("الرابط فاضي", "err");
  state.apiBase = v;
  saveState();
  toast("تم حفظ الرابط ✅", "ok");
}

async function testApi(){
  try{
    const r = await fetch(state.apiBase.replace(/\/$/, "") + "/", { headers: HEADERS });
    const d = await r.json();
    if (d.service === "ZoneCloud") toast("الاتصال شغال ✅", "ok");
    else toast("رد غير متوقع", "err");
  } catch(e){
    toast("فشل الاتصال: " + e.message, "err");
  }
}

/* ================================================================
   Init
   ================================================================ */
loadState();
if (state.token && state.username) state.page = "dashboard";
render();
</script>
